name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse preview signing key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: progress-percent-preview-signing-v1
      - name: Restore or preserve the existing signing key
        env:
          SIGNING_BACKUP_PASSWORD: ${{ secrets.SIGNING_BACKUP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          key = pathlib.Path.home() / '.android/debug.keystore'
          backup = pathlib.Path('android/signing.keystore.gpg')
          password = os.environ.get('SIGNING_BACKUP_PASSWORD', '')
          if backup.exists():
              if not password:
                  raise SystemExit('Encrypted signing backup exists but its repository secret is missing.')
              key.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['gpg','--batch','--yes','--pinentry-mode','loopback','--passphrase-fd','0','--output',str(key),'--decrypt',str(backup)],input=password.encode(),check=True)
          elif password:
              if not key.exists():
                  raise SystemExit('Existing signing key is missing. Do not generate a replacement.')
              subprocess.run(['gpg','--batch','--yes','--pinentry-mode','loopback','--passphrase-fd','0','--symmetric','--cipher-algo','AES256','--output',str(backup),str(key)],input=password.encode(),check=True)
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',str(backup)],check=True)
              subprocess.run(['git','commit','-m','Preserve encrypted Android signing key [skip ci]'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          else:
              print('Using existing cached key. Durable signing awaits SIGNING_BACKUP_PASSWORD setup.')
          PY
      - name: Prepare offline Android project
        run: |
          python android/prepare.py "$RUNNER_TEMP/progress-android"
          node --check "$RUNNER_TEMP/progress-android/app-script.js"
      - name: Build and check APK
        run: |
          gradle -p "$RUNNER_TEMP/progress-android" assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
          mkdir -p release
          cp "$RUNNER_TEMP/progress-android/app/build/outputs/apk/release/app-release.apk" release/Progress-Percent-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Progress-Percent-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Progress-Percent-Android.apk | head -n 15
          cd release
          sha256sum Progress-Percent-Android.apk > SHA256SUMS.txt
      - name: Build side-by-side migration APK
        run: |
          gradle -p "$RUNNER_TEMP/progress-android" -Pmigration=true assembleRelease --no-daemon
          cp "$RUNNER_TEMP/progress-android/app/build/outputs/apk/release/app-release.apk" release/Progress-Percent-New.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Progress-Percent-New.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Progress-Percent-New.apk | head -n 15
          cd release
          sha256sum Progress-Percent-Android.apk Progress-Percent-New.apk > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle -p "$RUNNER_TEMP/progress-android" connectedDebugAndroidTest --no-daemon
            keytool -genkeypair -keystore "$RUNNER_TEMP/legacy-fixture.keystore" -storepass fixture-only -alias fixture -keypass fixture-only -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Disposable Emulator Fixture" -noprompt
            cp "$RUNNER_TEMP/progress-android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/legacy-fixture.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/legacy-fixture.keystore" --ks-pass pass:fixture-only --ks-key-alias fixture "$RUNNER_TEMP/legacy-fixture.apk"
            adb uninstall com.jeevesh.progress || true
            adb install "$RUNNER_TEMP/legacy-fixture.apk"
            adb shell run-as com.jeevesh.progress mkdir -p files
            adb shell run-as com.jeevesh.progress touch files/migration-sentinel
            gradle -p "$RUNNER_TEMP/progress-android" -Pmigration=true connectedDebugAndroidTest --no-daemon
            adb shell pm path com.jeevesh.progress
            adb shell run-as com.jeevesh.progress test -f files/migration-sentinel
            mkdir -p docs/ui
            adb pull /sdcard/Download/progress-ui-overview.png docs/ui/overview.png
            adb pull /sdcard/Download/progress-ui-journal.png docs/ui/journal.png
            adb pull /sdcard/Download/progress-ui-finance.png docs/ui/finance.png
            adb pull /sdcard/Download/progress-ui-dark.png docs/ui/dark.png
      - name: Publish fictional demo UI previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ui/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update Android UI demo previews [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-report
          path: ${{ runner.temp }}/progress-android/app/build/reports/androidTests/
          if-no-files-found: ignore
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Progress-Percent-Android
          path: release/
          retention-days: 90
      - name: Publish tested Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Installable offline Android preview of Progress %.

          If Android reports a package conflict, download **Progress-Percent-New.apk**. It installs as **Progress % New** beside the old app. Keep the old app, export its backup from Profile, then restore that JSON file in the new app. Re-enable Health Connect permissions and auto sync in the new app. The normal **Progress-Percent-Android.apk** remains for compatible existing installations. Android 8.0 or newer with an updated Android System WebView is required.

          Redesigned interface with an indigo and mint daily score ring, consistent line icons, clearer goal cards, streamlined daily entry and grouped finance inputs. Light and dark themes. Demo-only emulator screenshots are available in docs/ui.

          Includes daily best comparisons by day type, target/limit/range scoring, quick check-in, per-measurement sync status, calendar, customizable dashboard, actual net worth, required-investment and inflation scenarios. Data stays in the app. Use Profile > Export backup before uninstalling or clearing app data. Website backups can be restored using Profile > Restore backup.

          This is a preview APK, not a Google Play release. It preserves the build-11 signing certificate. The build refuses to generate a replacement key. Durable encrypted signing backup is supported through a repository secret. Export a backup before installing updates.

          The build verifies the APK signature and runs Android emulator tests for offline loading, validation, reports, demo isolation and persistence after activity recreation. The migration app is also tested beside a disposable old-package fixture signed with a different key; its private test file must remain intact. No physical-phone test has been performed.
          NOTES
          gh release create "$tag" release/Progress-Percent-Android.apk release/Progress-Percent-New.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Progress % Android 1.5.0 preview (build ${GITHUB_RUN_NUMBER})" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
